name: CI

# Runs on every PR and on pushes to main. Same toolchain as the Dockerfile
# (Node 22, pnpm 10.34.9) so a green CI means the Railway build will pass too.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json (10.34.9)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: API — typecheck
        working-directory: apps/api
        run: pnpm typecheck

      - name: API — unit tests
        working-directory: apps/api
        run: pnpm test

      - name: Admin — typecheck + build
        working-directory: apps/admin
        run: pnpm build

      - name: Upgrade SQL is in sync with the migrations
        run: |
          bash scripts/build-upgrade-sql.sh
          git diff --exit-code database/UPGRADE_TENANT.sql || {
            echo "::error::database/UPGRADE_TENANT.sql is out of date. Run: bash scripts/build-upgrade-sql.sh"
            exit 1
          }
